name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [ml, backend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
        working-directory: ${{ matrix.package }}
      - run: ruff check .
        working-directory: ${{ matrix.package }}
      - run: |
          if [ -d sentinel_ml ]; then
            mypy sentinel_ml
          else
            mypy app
          fi
        working-directory: ${{ matrix.package }}
      - run: pytest
        working-directory: ${{ matrix.package }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
