[project]
name = "sentinel-ml"
version = "0.1.0"
description = "ML pipeline for Sentinel fraud detection research/demo."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "black>=24.8", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

