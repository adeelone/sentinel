[project]
name = "sentinel-backend"
version = "0.1.0"
description = "FastAPI service for Sentinel fraud detection research/demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.15.17",
  "black==26.5.1",
  "mypy==1.11.2",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"
