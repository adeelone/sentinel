[project]
name = "sentinel-backend"
version = "0.1.0"
description = "FastAPI service for Sentinel fraud detection research/demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "black>=24.8", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

