[project]
name = "sentinel-backend"
version = "0.1.0"
description = "FastAPI service for Sentinel fraud detection research/demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "joblib>=1.4",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "boto3>=1.35,<2",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.0",
  "httpx==0.28.1",
  "ruff==0.15.17",
  "black==26.5.1",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
